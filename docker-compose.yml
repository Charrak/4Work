name: dienstplan

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dienstplan
      POSTGRES_DB: dienstplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dienstplan -d dienstplan"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://dienstplan:${POSTGRES_PASSWORD}@db:5432/dienstplan
      BACKUP_DIR: /data/backups
      LOG_DIR: /data/logs
      DOCUMENTS_DIR: /data/documents
      TRUST_PROXY: "true"
      ALLOW_TENANT_REGISTRATION: "false"
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
