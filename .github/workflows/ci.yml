name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Abhängigkeiten fixiert?
        run: test -f requirements.lock || (echo "requirements.lock fehlt - ./scripts/lock-deps.sh ausführen und einchecken" && exit 1)
      - run: pip install --require-hashes -r requirements.lock && pip install pytest httpx
      - run: pytest -v
      - name: CVE-Prüfung (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Abhängigkeiten fixiert?
        run: test -f package-lock.json || (echo "package-lock.json fehlt - ./scripts/lock-deps.sh ausführen und einchecken" && exit 1)
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CVE-Prüfung (npm audit)
        run: npm audit --omit=dev --audit-level=high
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dienstplan-backend backend
      - name: Image auf Schwachstellen prüfen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dienstplan-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
