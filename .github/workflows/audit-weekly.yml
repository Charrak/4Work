name: Wöchentliche Schwachstellenprüfung
on:
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock
      - run: cd frontend && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
